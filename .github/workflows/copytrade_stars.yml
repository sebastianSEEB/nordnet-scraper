name: Kopihandel - stjerner på Nordnet Social

on:
  schedule:
    # Hver natt 02:17 UTC: sjekker de neste ~500 forumprofilene (mest aktive først),
    # hver profil på nytt etter 14 dager. Nordnet får ~1 forespørsel i sekundet.
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      max_profiles:
        description: 'Maks antall profiler denne kjøringen'
        default: '500'
        required: false

concurrency:
  group: copytrade-stars
  cancel-in-progress: false

jobs:
  stars:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install requests

      - name: Hent stjerner
        run: python copytrade/stars.py --max-profiles "${{ github.event.inputs.max_profiles || '500' }}" --delay 1.0 --max-minutes 20

      - name: Commit profiler
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nordnet_data/copytrade
          git diff --staged --quiet && exit 0
          git commit -m "Stjerner Nordnet Social $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
