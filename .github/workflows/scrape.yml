name: Nordnet Forum Scraper

on:
  schedule:
    # Tidspunkt er UTC. Oslo er UTC+2 om sommeren (som nå), UTC+1 om vinteren -
    # bytt til '*/30 5-18 * * 1-5' rundt slutten av oktober.
    #
    # Hvert 30. minutt, hverdager ca. 06:00-21:00 CEST - dekker god margin
    # før åpning og gjennom hele handelsdagen. Hver kjøring sender KUN det
    # som er nytt siden forrige (køen tømmes etter hver vellykkede rapport),
    # så kostnaden holder seg lav selv med denne frekvensen.
    - cron: '*/30 4-19 * * 1-5'
  workflow_dispatch: {}  # gjør at du også kan trigge en kjøring manuelt fra GitHub-fanen "Actions"

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install requests beautifulsoup4

      - name: Kjør scraperen
        run: python nordnet_forum_scraper.py --from-file watchlist_full.txt --data-dir nordnet_data

      - name: Analyser samlet kø, rapporter, varsle, tøm køen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python analyze_and_report.py

      - name: Commit og push oppdatert data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nordnet_data
          git diff --staged --quiet || git commit -m "Auto-oppdatering av forumdata $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
