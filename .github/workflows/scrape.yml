name: Nordnet Forum Scraper

on:
  schedule:
    # Tidspunkt er UTC. Oslo er UTC+2 om sommeren (som nå), UTC+1 om vinteren -
    # bytt tallene i "Bestem om vi skal analysere"-steget under tilsvarende
    # rundt slutten av oktober (trekk fra 1 time i stedet for 2).
    #
    # Kjører hver hele time, alle dager - scraper alltid, men analyserer
    # (kostnad) kun i vinduet definert i steget under.
    - cron: '0 * * * *'
    # Ekstra kjøring 15 min før åpning (08:45 CEST = 06:45 UTC), som ikke
    # faller på en hel time.
    - cron: '45 6 * * 1-5'
  workflow_dispatch: {}  # gjør at du også kan trigge en kjøring manuelt fra GitHub-fanen "Actions"

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer avhengigheter
        run: pip install requests beautifulsoup4

      - name: Kjør scraperen
        run: python nordnet_forum_scraper.py --from-file watchlist_full.txt --data-dir nordnet_data

      - name: Bestem om vi skal analysere denne runden
        id: decide
        run: |
          HOUR=$(date -u +%-H)
          MINUTE=$(date -u +%-M)
          DOW=$(date -u +%u)  # 1=mandag ... 7=søndag
          SHOULD_ANALYZE=false
          if [ "$DOW" -ge 1 ] && [ "$DOW" -le 5 ]; then
            # Pre-market: 06:45-06:49 UTC (08:45 CEST, 15 min før åpning)
            if [ "$HOUR" -eq 6 ] && [ "$MINUTE" -ge 45 ]; then
              SHOULD_ANALYZE=true
            # Handelstid: 07:00-14:00 UTC (09:00-16:00 CEST)
            elif [ "$HOUR" -ge 7 ] && [ "$HOUR" -le 14 ]; then
              SHOULD_ANALYZE=true
            fi
          fi
          echo "should_analyze=$SHOULD_ANALYZE" >> "$GITHUB_OUTPUT"
          echo "UTC-tid: ${HOUR}:${MINUTE}, ukedag: $DOW, analyser denne runden: $SHOULD_ANALYZE"

      - name: Analyser samlet kø, rapporter, varsle, tøm køen
        if: steps.decide.outputs.should_analyze == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python analyze_and_report.py

      - name: Commit og push oppdatert data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nordnet_data
          git diff --staged --quiet || git commit -m "Auto-oppdatering av forumdata $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
