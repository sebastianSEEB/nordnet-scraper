name: Ripple speed test

on:
  push:
    branches: [ripple-backtest]
    paths: ['speed.py', '.github/workflows/ripple-speed.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ripple-speed
  cancel-in-progress: true

jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q pandas numpy requests matplotlib yfinance
      - run: mkdir -p results && python -u speed.py 2>&1 | tee results/speed_log.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/speed* 
          git diff --staged --quiet || git commit -m "Ripple speed test output $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull -q --rebase origin ripple-backtest && git push origin HEAD:ripple-backtest && break; sleep 5; done
